<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>贪吃蛇 · Snake</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --grid: #16213a;
      --snake-head: #22c55e;
      --snake-body: #4ade80;
      --food: #f43f5e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: radial-gradient(1200px 800px at 50% -10%, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 16px;
      gap: 14px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 28px);
      letter-spacing: 2px;
    }

    .scoreboard {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 420px;
    }

    .score-card {
      flex: 1;
      background: var(--panel);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .score-card .label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .score-card .value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: var(--grid);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: block;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.78);
      border-radius: 14px;
      text-align: center;
      padding: 20px;
      backdrop-filter: blur(2px);
    }

    .overlay.hidden { display: none; }

    .overlay h2 {
      margin: 0;
      font-size: clamp(22px, 6vw, 30px);
    }

    .overlay p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #06281a;
      background: var(--snake-head);
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.96); }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 64px);
      gap: 8px;
      justify-content: center;
    }

    .controls button {
      width: 64px;
      height: 64px;
      padding: 0;
      font-size: 22px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .controls .up { grid-column: 2; grid-row: 1; }
    .controls .left { grid-column: 1; grid-row: 2; }
    .controls .down { grid-column: 2; grid-row: 2; }
    .controls .right { grid-column: 3; grid-row: 2; }

    .hint {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    /* 仅在触屏设备上显示方向按钮 */
    @media (hover: hover) and (pointer: fine) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <h1>贪吃蛇 SNAKE</h1>

  <div class="scoreboard">
    <div class="score-card">
      <div class="label">当前分数</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-card">
      <div class="label">最高分</div>
      <div class="value" id="best">0</div>
    </div>
  </div>

  <div class="board-wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">准备好了吗？</h2>
      <p id="overlay-text">方向键 / WASD 控制方向<br />吃到食物得分，撞墙或撞到自己就结束</p>
      <button id="start-btn">开始游戏</button>
    </div>
  </div>

  <div class="controls" aria-label="方向控制">
    <button class="up" data-dir="up" aria-label="上">↑</button>
    <button class="left" data-dir="left" aria-label="左">←</button>
    <button class="down" data-dir="down" aria-label="下">↓</button>
    <button class="right" data-dir="right" aria-label="右">→</button>
  </div>

  <p class="hint">桌面：方向键 / WASD ｜ 手机：滑动屏幕或点击方向键</p>

  <script>
    "use strict";

    const CELL_COUNT = 20;
    const INITIAL_SPEED_MS = 140;
    const MIN_SPEED_MS = 70;
    const SPEED_STEP_MS = 4;
    const SCORE_PER_FOOD = 10;
    const BEST_SCORE_KEY = "snake_best_score";

    const DIRECTIONS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayText = document.getElementById("overlay-text");
    const startBtn = document.getElementById("start-btn");

    const cellSize = canvas.width / CELL_COUNT;

    const state = {
      snake: [],
      direction: DIRECTIONS.right,
      pendingDirection: DIRECTIONS.right,
      food: { x: 0, y: 0 },
      score: 0,
      best: 0,
      speed: INITIAL_SPEED_MS,
      running: false,
      timerId: null,
    };

    function loadBestScore() {
      const saved = Number(localStorage.getItem(BEST_SCORE_KEY));
      state.best = Number.isFinite(saved) ? saved : 0;
      bestEl.textContent = state.best;
    }

    function saveBestScore() {
      if (state.score > state.best) {
        state.best = state.score;
        localStorage.setItem(BEST_SCORE_KEY, String(state.best));
        bestEl.textContent = state.best;
      }
    }

    function updateScore() {
      scoreEl.textContent = state.score;
    }

    function resetGame() {
      const startX = Math.floor(CELL_COUNT / 2);
      const startY = Math.floor(CELL_COUNT / 2);
      state.snake = [
        { x: startX, y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY },
      ];
      state.direction = DIRECTIONS.right;
      state.pendingDirection = DIRECTIONS.right;
      state.score = 0;
      state.speed = INITIAL_SPEED_MS;
      updateScore();
      spawnFood();
    }

    function spawnFood() {
      const occupied = new Set(state.snake.map((seg) => seg.x + "," + seg.y));
      let position;
      do {
        position = {
          x: Math.floor(Math.random() * CELL_COUNT),
          y: Math.floor(Math.random() * CELL_COUNT),
        };
      } while (occupied.has(position.x + "," + position.y));
      state.food = position;
    }

    function isReverse(next) {
      return next.x === -state.direction.x && next.y === -state.direction.y;
    }

    function setDirection(name) {
      const next = DIRECTIONS[name];
      if (!next) return;
      // 长度大于 1 时禁止直接反向自杀
      if (state.snake.length > 1 && isReverse(next)) return;
      state.pendingDirection = next;
    }

    function moveSnake() {
      state.direction = state.pendingDirection;
      const head = state.snake[0];
      const newHead = {
        x: head.x + state.direction.x,
        y: head.y + state.direction.y,
      };

      if (checkCollision(newHead)) {
        endGame();
        return;
      }

      state.snake.unshift(newHead);

      if (newHead.x === state.food.x && newHead.y === state.food.y) {
        state.score += SCORE_PER_FOOD;
        updateScore();
        state.speed = Math.max(MIN_SPEED_MS, state.speed - SPEED_STEP_MS);
        spawnFood();
      } else {
        state.snake.pop();
      }
    }

    function checkCollision(head) {
      const hitWall =
        head.x < 0 || head.y < 0 || head.x >= CELL_COUNT || head.y >= CELL_COUNT;
      if (hitWall) return true;
      return state.snake.some((seg) => seg.x === head.x && seg.y === head.y);
    }

    function drawCell(x, y, color, radius) {
      const px = x * cellSize;
      const py = y * cellSize;
      const pad = 1;
      const r = radius ?? 4;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(px + pad, py + pad, cellSize - pad * 2, cellSize - pad * 2, r);
      ctx.fill();
    }

    function drawFood() {
      drawCell(state.food.x, state.food.y, getColor("--food"), cellSize / 2);
    }

    function drawSnake() {
      state.snake.forEach((seg, index) => {
        const color = index === 0 ? getColor("--snake-head") : getColor("--snake-body");
        drawCell(seg.x, seg.y, color, index === 0 ? 6 : 4);
      });
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawFood();
      drawSnake();
    }

    function getColor(varName) {
      return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    }

    function tick() {
      moveSnake();
      if (!state.running) return;
      render();
      state.timerId = setTimeout(tick, state.speed);
    }

    function startGame() {
      resetGame();
      render();
      state.running = true;
      overlay.classList.add("hidden");
      clearTimeout(state.timerId);
      state.timerId = setTimeout(tick, state.speed);
    }

    function endGame() {
      state.running = false;
      clearTimeout(state.timerId);
      saveBestScore();
      overlayTitle.textContent = "游戏结束";
      overlayText.innerHTML =
        "本局得分：<b>" + state.score + "</b><br />再来一局挑战最高分吧！";
      startBtn.textContent = "重新开始";
      overlay.classList.remove("hidden");
    }

    function handleKeydown(event) {
      const keyMap = {
        ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
        w: "up", s: "down", a: "left", d: "right",
        W: "up", S: "down", A: "left", D: "right",
      };
      const dir = keyMap[event.key];
      if (!dir) return;
      event.preventDefault();
      if (!state.running && overlay.classList.contains("hidden") === false) return;
      setDirection(dir);
    }

    function bindTouchControls() {
      document.querySelectorAll(".controls button").forEach((btn) => {
        btn.addEventListener("click", () => setDirection(btn.dataset.dir));
      });

      let startX = 0;
      let startY = 0;
      const SWIPE_THRESHOLD = 24;

      canvas.addEventListener("touchstart", (e) => {
        const touch = e.changedTouches[0];
        startX = touch.clientX;
        startY = touch.clientY;
      }, { passive: true });

      canvas.addEventListener("touchend", (e) => {
        const touch = e.changedTouches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          setDirection(dx > 0 ? "right" : "left");
        } else {
          setDirection(dy > 0 ? "down" : "up");
        }
      }, { passive: true });
    }

    function init() {
      loadBestScore();
      startBtn.addEventListener("click", startGame);
      document.addEventListener("keydown", handleKeydown);
      bindTouchControls();
      render();
    }

    init();
  </script>
</body>
</html>
